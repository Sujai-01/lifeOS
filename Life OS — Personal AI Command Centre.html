<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS — Your Personal AI Command Centre</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #6b7280;
    --fitness: #34d399;
    --fitness-bg: rgba(52,211,153,0.08);
    --nutrition: #f97316;
    --nutrition-bg: rgba(249,115,22,0.08);
    --learning: #818cf8;
    --learning-bg: rgba(129,140,248,0.08);
    --money: #fbbf24;
    --money-bg: rgba(251,191,36,0.08);
    --wellbeing: #f472b6;
    --wellbeing-bg: rgba(244,114,182,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .logo span { color: var(--learning); }

  .header-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--fitness);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* AGENT TABS */
  .tab-bar {
    display: flex;
    gap: 0;
    padding: 0 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); }
  .tab.active.fitness { border-bottom-color: var(--fitness); color: var(--fitness); }
  .tab.active.nutrition { border-bottom-color: var(--nutrition); color: var(--nutrition); }
  .tab.active.learning { border-bottom-color: var(--learning); color: var(--learning); }
  .tab.active.money { border-bottom-color: var(--money); color: var(--money); }
  .tab.active.wellbeing { border-bottom-color: var(--wellbeing); color: var(--wellbeing); }

  .tab-icon { font-size: 16px; }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 113px);
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .agent-info {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  .agent-avatar {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 12px;
  }

  .agent-name {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .agent-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .agent-skills {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .skills-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .skill-chip {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    margin: 3px 3px 3px 0;
    font-weight: 500;
  }

  .quick-prompts {
    padding: 16px 20px;
  }

  .quick-prompt-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 7px;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    line-height: 1.4;
  }
  .quick-prompt-btn:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.15);
    background: var(--surface);
  }

  /* CHAT AREA */
  .chat-area {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }

  .chat-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
  }

  .clear-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }
  .clear-btn:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.15);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--surface2) transparent;
  }

  .message {
    display: flex;
    gap: 12px;
    max-width: 760px;
  }

  .message.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.65;
    max-width: 580px;
  }

  .message.agent .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .message.user .msg-bubble {
    background: var(--surface2);
    border-top-right-radius: 4px;
  }

  .msg-name {
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 5px;
  }

  /* TYPING INDICATOR */
  .typing {
    display: flex;
    gap: 12px;
    max-width: 760px;
  }
  .typing-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    border-top-left-radius: 4px;
    padding: 14px 18px;
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* INPUT */
  .input-area {
    padding: 16px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-wrap {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    padding: 2px 4px 2px 14px;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: rgba(255,255,255,0.2); }

  #userInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    resize: none;
    padding: 10px 0;
    max-height: 120px;
    overflow-y: auto;
    scrollbar-width: none;
    line-height: 1.5;
  }
  #userInput::placeholder { color: var(--muted); }

  .send-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-bottom: 2px;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* WELCOME STATE */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    text-align: center;
    padding: 40px;
  }
  .welcome-icon { font-size: 42px; margin-bottom: 6px; }
  .welcome-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .welcome-sub { font-size: 13px; max-width: 320px; }

  /* SCROLLBAR */
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

  /* Markdown-like formatting in messages */
  .msg-bubble strong { font-weight: 600; color: #fff; }
  .msg-bubble em { font-style: italic; color: var(--muted); }
  .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 6px 0; }
  .msg-bubble li { margin: 3px 0; }
  .msg-bubble code {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
    font-family: monospace;
  }

  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    header { padding: 14px 16px; }
    .tab-bar { padding: 0 10px; }
    .messages { padding: 16px; }
    .input-area { padding: 12px 16px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Life<span>OS</span></div>
    <div class="header-sub">Your personal AI command centre</div>
  </div>
  <div class="status-bar">
    <div class="status-dot"></div>
    <span>All agents online</span>
  </div>
</header>

<div class="tab-bar" id="tabBar">
  <button class="tab fitness active" data-agent="fitness" onclick="switchAgent('fitness')">
    <span class="tab-icon">🏋️</span> Fitness
  </button>
  <button class="tab nutrition" data-agent="nutrition" onclick="switchAgent('nutrition')">
    <span class="tab-icon">🍽️</span> Nutrition
  </button>
  <button class="tab learning" data-agent="learning" onclick="switchAgent('learning')">
    <span class="tab-icon">📚</span> Learning
  </button>
  <button class="tab money" data-agent="money" onclick="switchAgent('money')">
    <span class="tab-icon">💰</span> Money
  </button>
  <button class="tab wellbeing" data-agent="wellbeing" onclick="switchAgent('wellbeing')">
    <span class="tab-icon">🧘</span> Wellbeing
  </button>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-title" id="chatTitle">🏋️ Fitness Agent</div>
      <button class="clear-btn" onclick="clearChat()">Clear chat</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="userInput" rows="1" placeholder="Ask your agent anything…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" style="background: var(--active-color, #818cf8);">➤</button>
    </div>
  </div>
</div>

<script>
const AGENTS = {
  fitness: {
    name: "Fitness Agent",
    icon: "🏋️",
    color: "#34d399",
    bg: "rgba(52,211,153,0.08)",
    desc: "Your dedicated workout coach. Builds plans, tracks progress, and keeps you moving toward your physical goals.",
    skills: ["Workout Plans", "Rep/Set Guidance", "Progress Tracking", "Injury Prevention", "Cardio Strategy"],
    prompts: [
      "Build me a 4-week beginner workout plan",
      "What's the best way to lose belly fat?",
      "Create a home workout with no equipment",
      "How many calories does a 30min run burn?"
    ],
    system: `You are a professional fitness coach and personal trainer. You specialize in creating personalized workout plans, providing exercise guidance, tracking fitness progress, and offering evidence-based advice on physical training.

Your personality: motivating, knowledgeable, practical. You speak in clear, actionable terms. You ask follow-up questions when needed (e.g., asking about fitness level, available equipment, goals). You give structured workout plans with sets/reps when asked. You always prioritize safety and proper form.

Important: Stay strictly within fitness topics — exercise, physical training, body composition, athletic performance. If asked about nutrition or mental health, briefly acknowledge and suggest the user switches to the relevant agent.`
  },
  nutrition: {
    name: "Nutrition Agent",
    icon: "🍽️",
    color: "#f97316",
    bg: "rgba(249,115,22,0.08)",
    desc: "Your personal dietitian. Plans meals, tracks nutrients, and helps you build a sustainable relationship with food.",
    skills: ["Meal Planning", "Calorie Tracking", "Macro Balancing", "Recipe Ideas", "Diet Strategy"],
    prompts: [
      "Create a 7-day meal plan for weight loss",
      "What should I eat before a morning workout?",
      "High protein meals under 500 calories",
      "Explain intermittent fasting for beginners"
    ],
    system: `You are a registered dietitian and nutrition expert. You specialize in meal planning, calorie and macro tracking, dietary strategies, and building healthy eating habits.

Your personality: warm, non-judgmental, science-backed. You provide practical meal ideas, calculate calories/macros when asked, suggest healthy swaps, and explain the 'why' behind nutritional choices. You respect different dietary preferences (vegan, keto, etc.).

Important: Stay within nutrition and diet topics. If asked about exercise planning or mental health, briefly acknowledge and suggest switching to the appropriate agent.`
  },
  learning: {
    name: "Learning Agent",
    icon: "📚",
    color: "#818cf8",
    bg: "rgba(129,140,248,0.08)",
    desc: "Your study strategist. Creates study plans, explains concepts, generates quizzes, and accelerates your learning.",
    skills: ["Study Plans", "Concept Explanation", "Quiz Generation", "Memory Techniques", "Resource Curation"],
    prompts: [
      "Make a 30-day Python learning roadmap",
      "Explain neural networks like I'm 15",
      "Quiz me on world history — 10 questions",
      "Best techniques for memorizing fast?"
    ],
    system: `You are an expert learning coach, educator, and study strategist. You help people learn faster and more effectively through personalized study plans, clear explanations, active recall techniques, and adaptive quizzes.

Your personality: patient, clear, intellectually curious. You break complex topics into digestible parts, use analogies and examples, generate practice questions, and suggest the most efficient learning paths. You adapt your explanation depth to the user's level.

Important: Stay within learning, education, and skill development topics. For health or financial questions, briefly acknowledge and suggest the appropriate agent.`
  },
  money: {
    name: "Money Agent",
    icon: "💰",
    color: "#fbbf24",
    bg: "rgba(251,191,36,0.08)",
    desc: "Your financial advisor. Plans budgets, tracks savings goals, explains investments, and builds financial clarity.",
    skills: ["Budgeting", "Savings Goals", "Investment Basics", "Expense Tracking", "Financial Planning"],
    prompts: [
      "Build me a monthly budget on ₹30,000",
      "How should I start investing at 22?",
      "Best strategies to save ₹1 lakh in 6 months",
      "Explain mutual funds vs fixed deposits"
    ],
    system: `You are a personal finance advisor and money coach. You specialize in budgeting, savings strategies, investment basics, expense tracking, and helping people achieve financial goals.

Your personality: straightforward, practical, empowering. You avoid jargon unless you explain it. You give concrete numbers and actionable steps. You understand the Indian financial context (₹, SIP, FD, PPF, NPS, etc.) but can handle any currency.

Disclaimer: You provide general financial education, not certified financial advice. Always note when professional advice may be needed for large decisions.

Important: Stay within personal finance topics. For health, fitness, or learning questions, briefly acknowledge and suggest the appropriate agent.`
  },
  wellbeing: {
    name: "Wellbeing Agent",
    icon: "🧘",
    color: "#f472b6",
    bg: "rgba(244,114,182,0.08)",
    desc: "Your mental wellness guide. Supports journaling, stress relief, mindfulness, and helps you build positive habits.",
    skills: ["Journaling Prompts", "Stress Relief", "Mindfulness", "Habit Building", "Emotional Support"],
    prompts: [
      "I'm feeling overwhelmed — help me calm down",
      "Give me a 5-minute mindfulness exercise",
      "Journal prompts for self-reflection",
      "How do I build a morning routine?"
    ],
    system: `You are a mindfulness coach, wellness guide, and positive psychology practitioner. You help people manage stress, build positive habits, practice mindfulness, journal for self-reflection, and improve their overall mental wellbeing.

Your personality: calm, compassionate, non-judgmental, gently encouraging. You listen first, then guide. You offer breathing exercises, journaling prompts, mindfulness techniques, and practical habit-building frameworks.

Important: You are a wellness coach, not a therapist. If someone expresses serious mental health concerns or crisis, compassionately encourage them to seek professional support. Stay within mental wellness, mindfulness, and positive habit topics.`
  }
};

let currentAgent = 'fitness';
let conversations = { fitness: [], nutrition: [], learning: [], money: [], wellbeing: [] };
let isLoading = false;

function switchAgent(agent) {
  currentAgent = agent;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-agent="${agent}"]`).classList.add('active');
  document.documentElement.style.setProperty('--active-color', AGENTS[agent].color);
  document.getElementById('sendBtn').style.background = AGENTS[agent].color;
  document.getElementById('chatTitle').textContent = `${AGENTS[agent].icon} ${AGENTS[agent].name}`;
  renderSidebar(agent);
  renderMessages(agent);
  document.getElementById('userInput').placeholder = `Ask your ${AGENTS[agent].name.split(' ')[0].toLowerCase()} agent…`;
}

function renderSidebar(agent) {
  const a = AGENTS[agent];
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = `
    <div class="agent-info">
      <div class="agent-avatar" style="background:${a.bg}; color:${a.color}">${a.icon}</div>
      <div class="agent-name" style="color:${a.color}">${a.name}</div>
      <div class="agent-desc">${a.desc}</div>
    </div>
    <div class="agent-skills">
      <div class="skills-label">Specialities</div>
      ${a.skills.map(s => `<span class="skill-chip" style="background:${a.bg};color:${a.color}">${s}</span>`).join('')}
    </div>
    <div class="quick-prompts">
      <div class="skills-label">Try asking</div>
      ${a.prompts.map(p => `<button class="quick-prompt-btn" onclick="sendQuick('${p.replace(/'/g, "\\'")}')">${p}</button>`).join('')}
    </div>
  `;
}

function renderMessages(agent) {
  const msgs = conversations[agent];
  const container = document.getElementById('messages');

  if (msgs.length === 0) {
    container.innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">${AGENTS[agent].icon}</div>
        <div class="welcome-title">Meet your ${AGENTS[agent].name}</div>
        <div class="welcome-sub">${AGENTS[agent].desc} Try a quick prompt from the sidebar to get started.</div>
      </div>
    `;
    return;
  }

  container.innerHTML = msgs.map(m => {
    if (m.role === 'user') {
      return `
        <div class="message user">
          <div class="msg-avatar" style="background:var(--surface2)">👤</div>
          <div class="msg-bubble">${escHtml(m.content)}</div>
        </div>
      `;
    } else {
      return `
        <div class="message agent">
          <div class="msg-avatar" style="background:${AGENTS[agent].bg};color:${AGENTS[agent].color}">${AGENTS[agent].icon}</div>
          <div class="msg-bubble">
            <div class="msg-name" style="color:${AGENTS[agent].color}">${AGENTS[agent].name}</div>
            ${formatMsg(m.content)}
          </div>
        </div>
      `;
    }
  }).join('');

  container.scrollTop = container.scrollHeight;
}

function escHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatMsg(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.*$)/gm, '<strong>$1</strong>')
    .replace(/^## (.*$)/gm, '<strong>$1</strong>')
    .replace(/^# (.*$)/gm, '<strong>$1</strong>')
    .replace(/^\- (.*$)/gm, '<li>$1</li>')
    .replace(/^\d+\. (.*$)/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const container = document.getElementById('messages');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.id = 'typingIndicator';
  typing.innerHTML = `
    <div class="msg-avatar" style="background:${AGENTS[currentAgent].bg};color:${AGENTS[currentAgent].color}">${AGENTS[currentAgent].icon}</div>
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  `;
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function sendQuick(text) {
  document.getElementById('userInput').value = text;
  await sendMessage();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  // Clear welcome state
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();

  // Add user message
  conversations[currentAgent].push({ role: 'user', content: text });
  renderMessages(currentAgent);
  showTyping();

  try {
    const agent = AGENTS[currentAgent];
    const history = conversations[currentAgent].slice(-10); // last 10 messages for context

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: agent.system,
        messages: history.map(m => ({ role: m.role, content: m.content }))
      })
    });

    const data = await response.json();
    const reply = data.content?.[0]?.text || 'Sorry, I encountered an issue. Please try again.';

    conversations[currentAgent].push({ role: 'assistant', content: reply });
  } catch (err) {
    conversations[currentAgent].push({ role: 'assistant', content: 'Connection error. Please check your setup and try again.' });
  }

  hideTyping();
  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  renderMessages(currentAgent);
}

function clearChat() {
  conversations[currentAgent] = [];
  renderMessages(currentAgent);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// Init
switchAgent('fitness');
</script>
</body>
</html>
